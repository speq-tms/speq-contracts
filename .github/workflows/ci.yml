name: ci

on:
  pull_request:
  push:
    branches: [main, "v*"]

env:
  # The released CLI is used to produce a real summary.json for the results
  # schema to validate. Bump deliberately when a new version ships.
  SPEQ_VERSION: v1.0.0

jobs:
  conformance:
    name: contracts match reality
    runs-on: ubuntu-latest
    steps:
      - name: Check out contracts
        uses: actions/checkout@v4

      # The release flow keeps a same-named branch in every affected repository
      # -- milestone title == RC branch name. So a PR into v1.1.0 here has to be
      # checked against v1.1.0 there, not against main, which predates the RC.
      # Falls back to main outside a release candidate, or if the other
      # repository has no branch for this one.
      - name: Resolve the matching speq-examples ref
        id: examples
        run: |
          ref="${{ github.base_ref || github.ref_name }}"
          if [ "${ref#v}" != "$ref" ] \
             && git ls-remote --exit-code --heads \
                  https://github.com/speq-tms/speq-examples.git "$ref" >/dev/null 2>&1; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            ref=main
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "checking against speq-examples@$ref"

      - name: Check out examples
        uses: actions/checkout@v4
        with:
          repository: speq-tms/speq-examples
          ref: ${{ steps.examples.outputs.ref }}
          path: .examples

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema pyyaml referencing

      # A schema can be right about every file on disk and still describe a
      # summary.json the runtime no longer produces -- that is how v1.0.0
      # shipped `pending` and `coverage` with no contract for either. So the
      # gate validates a summary from an actual run, not a checked-in sample.
      - name: Produce a real summary.json
        run: |
          curl -fsSL -o speq.tar.gz \
            "https://github.com/speq-tms/speq-cli/releases/download/${SPEQ_VERSION}/speq-linux-x86_64.tar.gz"
          tar -xzf speq.tar.gz
          ./speq run --speq-root .examples/quickstart --env ci \
            --report summary --output "$PWD/summary.json"

      - name: Check conformance
        run: |
          python3 scripts/check-conformance.py \
            --schemas schemas \
            --examples .examples \
            --cases tests/cases \
            --summary summary.json
