# Conformance cases for schemas/manifest/v1.json. See README.md.
#
# The manifest is read by read_manifest at every command's start, not by
# 'speq validate', so cases about how it parses are parity: run-only.
- name: the minimum a manifest needs
  expect: accept
  doc: {version: "1", project: demo, defaultEnvironment: ci}

- name: every directory key
  expect: accept
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    environmentsDir: environments
    suitesDir: suites
    reportsDir: reports
    schemasDir: schemas
    modulesDir: modules
    fixturesDir: fixtures

- name: coverage threshold in camelCase
  expect: accept
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    coverage: {enabled: true, openapi: ./openapi.yaml, report: true, failBelow: 80}

- name: coverage threshold in the deprecated snake_case spelling
  expect: accept
  why: >-
    'fail_below' is what v1.0.0 shipped and what speq-examples still writes, so
    speq-cli keeps it as a serde alias of 'failBelow' (speq-tms/speq-docs#1).
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    coverage: {enabled: true, fail_below: 80}

- name: coverage with both spellings of the threshold
  expect: reject
  parity: run-only
  why: >-
    They are one serde field, so read_manifest fails with
    'coverage: duplicate field `failBelow`' rather than picking a winner.
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    coverage: {failBelow: 90, fail_below: 50}

- name: a manifest with no version
  expect: reject
  parity: run-only
  why: >-
    'speq validate' does not re-check the manifest; read_manifest does, at every
    command's start, where a missing required field is a deserialisation error.
  doc: {project: demo, defaultEnvironment: ci}

- name: an unknown top-level key
  expect: reject
  parity: schema-only
  why: >-
    speq-cli ignores unknown manifest keys silently, so a misspelled 'suitesDir'
    leaves the project pointing at the default directory with no warning. The
    schema is closed so an editor says so.
  doc: {version: "1", project: demo, defaultEnvironment: ci, suiteDir: suites}

- name: a coverage threshold above 100
  expect: reject
  parity: schema-only
  why: >-
    speq-cli accepts any f64 and the gate simply never passes. A percentage
    outside 0..100 is always a mistake.
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    coverage: {failBelow: 140}

- name: a full http transport block
  expect: accept
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    http:
      timeoutMs: 15000
      connectTimeoutMs: 5000
      followRedirects: true
      proxy: http://proxy.internal:8080
      caFile: tls/ca.pem
      clientCert: tls/client.pem
      clientKey: tls/client.key
      insecureSkipVerify: false

- name: followRedirects as an explicit hop limit
  expect: accept
  why: >-
    The field is a bool or an integer: false and 0 both mean 'do not follow',
    true means the default limit of 10 hops.
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    http: {followRedirects: 4}

- name: a zero request timeout
  expect: reject
  parity: run-only
  why: >-
    HttpConfig::validate rejects it at read_manifest time -- a budget of zero is
    a client that can never complete a request, not a client without a budget.
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    http: {timeoutMs: 0}

- name: a connect timeout larger than the total budget
  expect: accept
  parity: cli-only
  why: >-
    read_manifest rejects it -- the connect budget is a subset of the total one,
    so a larger value can never be reached. JSON Schema has no way to compare
    two sibling numbers, so the schema cannot carry the constraint and the
    editor stays quiet where the CLI does not.
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    http: {timeoutMs: 1000, connectTimeoutMs: 5000}

- name: a client certificate without its key
  expect: reject
  parity: run-only
  why: >-
    rustls needs certificate and key together to build an identity, so half a
    pair is a mutual-TLS setup that silently does not authenticate.
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    http: {clientCert: tls/client.pem}

- name: a misspelled http key
  expect: reject
  parity: run-only
  why: >-
    HttpConfig is the one manifest block with deny_unknown_fields, so a typo is
    an error instead of a transport setting that silently never applies.
  doc:
    version: "1"
    project: demo
    defaultEnvironment: ci
    http: {timeoutMS: 5000}
