# Conformance cases for schemas/module/v1.json. See README.md.
- name: action with properties, steps and returns
  expect: accept
  doc:
    actions:
      getPostById:
        properties: [postId]
        steps:
          - {type: api, id: get_post, name: "GET post", method: GET, url: "/posts/{{postId}}"}
        returns:
          userId: "$steps.get_post.response.body.userId"

- name: legacy shorthand, a bare step array
  expect: accept
  doc:
    actions:
      warmup:
        - {type: api, name: "GET root", method: GET, url: /}

- name: module variables
  expect: accept
  doc:
    variables: {retries: 3}
    actions:
      noop:
        steps: [{type: api, name: n, method: GET, url: /x}]

- name: a module with no actions at all
  expect: accept
  doc: {}

- name: returns expression missing the $steps prefix
  expect: reject
  doc:
    actions:
      a:
        steps: [{type: api, id: s, name: n, method: GET, url: /x}]
        returns: {out: "s.response.body.id"}

- name: returns expression missing .response.body.
  expect: reject
  doc:
    actions:
      a:
        steps: [{type: api, id: s, name: n, method: GET, url: /x}]
        returns: {out: "$steps.s.id"}

- name: returns expression with an empty body path
  expect: reject
  parity: schema-only
  why: >-
    validate_module_content splits on '.response.body.' and only checks that the step id
    exists, so it accepts a trailing empty path. The expression can never resolve at run time.
  doc:
    actions:
      a:
        steps: [{type: api, id: s, name: n, method: GET, url: /x}]
        returns: {out: "$steps.s.response.body."}

- name: action step that is not a valid step
  expect: reject
  parity: schema-only
  why: >-
    validate_module_content never calls validate_step, so 'speq validate' passes a module
    whose action contains an unrunnable step. See speq-tms/speq-docs#23.
  doc:
    actions:
      a:
        steps: [{type: api, name: n, method: GET}]

- name: 'module: wrapper key, which the CLI silently ignores'
  expect: reject
  parity: schema-only
  why: >-
    ModuleSpec ignores unknown keys, so a wrapped file parses as a module with no actions
    and fails only when a test tries to call one of them.
  doc:
    module:
      actions:
        a:
          steps: [{type: api, name: n, method: GET, url: /x}]
