# Conformance cases for schemas/environment/v1.json. See README.md.
#
# This schema is open: the CLI turns every key other than baseUrl and headers into
# a variable of that name, so an environment file has no fixed key set. The reject
# cases here are about types, not about unknown keys.
- name: the shape the examples use
  expect: accept
  doc:
    name: ci
    baseUrl: https://jsonplaceholder.typicode.com
    headers: {x-source: speq-examples}

- name: arbitrary keys become variables
  expect: accept
  doc:
    baseUrl: https://example.test
    apiVersion: 2
    retries: [1, 2, 3]
    feature: {enabled: true}

- name: an environment with no baseUrl at all
  expect: accept
  doc: {token: abc}

- name: baseUrl must be a string
  expect: reject
  parity: run-only
  why: >-
    'speq validate' does not read environment files; read_env_config does, at run time,
    where a non-string baseUrl is a deserialisation error.
  doc: {baseUrl: 8080}

- name: headers values must be strings
  expect: reject
  parity: run-only
  why: >-
    'speq validate' does not read environment files. read_env_config does, at run time,
    where headers is typed as a map of strings -- a non-string value is a deserialisation
    error there too (speq-tms/speq-docs#21).
  doc: {baseUrl: https://example.test, headers: {retries: 3}}

- name: headers may reference environment variables
  expect: accept
  doc:
    baseUrl: https://example.test
    token: t0ken
    headers: {authorization: "Bearer {{token}}"}
