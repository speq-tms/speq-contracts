# Conformance cases for schemas/environment/v1.json. See README.md.
#
# This schema is open: the CLI turns every key other than baseUrl and headers into
# a variable of that name, so an environment file has no fixed key set. The reject
# cases here are about types, not about unknown keys.
- name: the shape the examples use
  expect: accept
  doc:
    name: ci
    baseUrl: https://jsonplaceholder.typicode.com
    headers: {x-source: speq-examples}

- name: arbitrary keys become variables
  expect: accept
  doc:
    baseUrl: https://example.test
    apiVersion: 2
    retries: [1, 2, 3]
    feature: {enabled: true}

- name: an environment with no baseUrl at all
  expect: accept
  doc: {token: abc}

- name: baseUrl must be a string
  expect: reject
  parity: run-only
  why: >-
    'speq validate' does not read environment files; read_env_config does, at run time,
    where a non-string baseUrl is a deserialisation error.
  doc: {baseUrl: 8080}

- name: headers values must be strings
  expect: reject
  parity: run-only
  why: >-
    'speq validate' does not read environment files. read_env_config does, at run time,
    where headers is typed as a map of strings -- a non-string value is a deserialisation
    error there too (speq-tms/speq-docs#21).
  doc: {baseUrl: https://example.test, headers: {retries: 3}}

- name: headers may reference environment variables
  expect: accept
  doc:
    baseUrl: https://example.test
    token: t0ken
    headers: {authorization: "Bearer {{token}}"}

- name: an http block narrowing the manifest's transport policy
  expect: accept
  why: >-
    Like 'headers', 'http' is read rather than turned into a variable. Only the
    fields named here override the manifest; the rest fall through.
  doc:
    name: ci
    baseUrl: https://api.example.com
    http: {timeoutMs: 2000}

- name: an environment http block with a zero timeout
  expect: reject
  why: >-
    'speq validate' now reads every environment file's http block, so a budget
    that can never be met is reported before a run rather than on its first
    request.
  doc:
    name: ci
    baseUrl: https://api.example.com
    http: {timeoutMs: 0}

- name: values carrying ${VAR} placeholders
  expect: accept
  parity: run-only
  why: >-
    Substitution runs before deserialisation, so the schema only ever sees the
    resolved value. The case exists to pin that no field is narrowed in a way
    that would reject the placeholder text an editor checks before resolution.
  doc:
    name: ci
    baseUrl: "${SPEQ_BASE_URL:-https://api.example.com}"
    headers:
      authorization: "Bearer ${SPEQ_TOKEN}"
    literalDollar: "$${NOT_A_PLACEHOLDER}"

- name: an environment holding oauth2 client credentials
  expect: accept
  why: >-
    Like 'headers' and 'http', 'auth' is read rather than turned into a
    variable. Not one credential is written in the file: it names the variables
    the OS environment supplies, which is the point of the block.
  doc:
    name: ci
    baseUrl: https://api.example.com
    auth:
      type: oauth2
      tokenUrl: https://id.example.com/oauth/token
      clientId: "${SPEQ_CLIENT_ID}"
      clientSecret: "${SPEQ_CLIENT_SECRET}"
      scopes: [orders.read, orders.write]

- name: an unsupported auth scheme
  expect: reject
  why: >-
    'speq validate' reads every environment file's auth block, so a scheme the
    runtime cannot present is reported before a run rather than on its first
    request.
  doc:
    name: ci
    baseUrl: https://api.example.com
    auth:
      type: apikey
      key: "${SPEQ_API_KEY}"
