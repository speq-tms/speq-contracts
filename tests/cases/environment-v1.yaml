# Conformance cases for schemas/environment/v1.json. See README.md.
#
# This schema is open: the CLI turns every key other than baseUrl into a variable
# of that name, so an environment file has no fixed key set. The reject cases here
# are about types, not about unknown keys.
- name: the shape the examples use
  expect: accept
  doc:
    name: ci
    baseUrl: https://jsonplaceholder.typicode.com
    headers: {x-source: speq-examples}

- name: arbitrary keys become variables
  expect: accept
  doc:
    baseUrl: https://example.test
    apiVersion: 2
    retries: [1, 2, 3]
    feature: {enabled: true}

- name: an environment with no baseUrl at all
  expect: accept
  doc: {token: abc}

- name: baseUrl must be a string
  expect: reject
  parity: run-only
  why: >-
    'speq validate' does not read environment files; read_env_vars does, at run time,
    where a non-string baseUrl is a deserialisation error.
  doc: {baseUrl: 8080}

- name: headers values must be strings
  expect: reject
  parity: schema-only
  why: >-
    The CLI never reads this key as headers at all -- it becomes an ordinary variable of
    any shape (speq-tms/speq-docs#21). The constraint states the convention the key is
    named for, so a mistake is visible in an editor.
  doc: {baseUrl: https://example.test, headers: {retries: 3}}
